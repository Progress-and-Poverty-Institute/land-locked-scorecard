<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Locked? — Digital Score Card</title>
<style>
  :root{
    --green:#0F6E56; --green-d:#0a5442; --grey:#444441; --grey-d:#2f2f2d;
    --navy:#1F3A5F; --ink:#1A1A1A; --soft:#6a6f6d; --line:#d8dddb;
    --paper:#fbfcfb; --tintg:#eaf3ed; --tintr:#eeeeec; --bad:#9E2B2B; --good:#0F6E56;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#eef1f0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
  h1{font-size:1.5rem;margin:.2em 0 .1em;letter-spacing:.5px;}
  h1 .lock{color:var(--green);} 
  .sub{color:var(--soft);font-size:.9rem;margin-bottom:14px;}
  .town-pick{display:flex;gap:10px;margin:14px 0 6px;}
  .town-pick button{flex:1;padding:16px 10px;border:2px solid var(--line);border-radius:12px;
    background:#fff;font-size:1rem;font-weight:700;cursor:pointer;line-height:1.3;transition:.15s;}
  .town-pick button small{display:block;font-weight:400;font-size:.72rem;color:var(--soft);margin-top:4px;}
  .town-pick button.lvt.active{border-color:var(--green);background:var(--tintg);color:var(--green-d);}
  .town-pick button.reg.active{border-color:var(--grey);background:var(--tintr);color:var(--grey-d);}
  .bar{position:sticky;top:0;z-index:20;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin:12px 0;display:flex;align-items:center;
    gap:10px;flex-wrap:wrap;box-shadow:0 1px 6px rgba(0,0,0,.05);}
  .bar .cash{font-size:1.35rem;font-weight:800;}
  .bar .cash.neg{color:var(--bad);}
  .bar .lbl{font-size:.7rem;color:var(--soft);text-transform:none;}
  .bar .rnd{margin-left:auto;font-weight:700;color:var(--navy);}
  .pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:.8rem;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;}
  .card h2{margin:0 0 4px;font-size:1.05rem;}
  .card .step{color:var(--soft);font-size:.78rem;margin-bottom:10px;}
  .zone{margin:10px 0;}
  .zone .zt{font-weight:700;font-size:.85rem;margin-bottom:4px;color:var(--navy);}
  .grid{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;}
  .rowline{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;
    padding:5px 0;border-bottom:1px solid #eef1f0;}
  .rowline .desc{font-size:.9rem;}
  .rowline .desc small{color:var(--soft);}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;}
  .stepper button{width:34px;height:38px;border:none;background:#f2f5f4;font-size:1.25rem;cursor:pointer;color:var(--navy);line-height:1;}
  .stepper button:active{background:var(--tintg);}
  .stepper .val{width:34px;text-align:center;font-weight:700;font-size:1rem;}
  .built{background:var(--tintg);border-radius:8px;padding:2px 0;}
  .muted{color:var(--soft);}
  .summary{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.92rem;margin-top:6px;}
  .summary .v{font-weight:700;text-align:right;}
  .summary .v.plus{color:var(--good);}
  .summary .v.minus{color:var(--bad);}
  .divider{height:1px;background:var(--line);margin:8px 0;}
  .btns{display:flex;gap:10px;margin-top:14px;}
  .btns button{flex:1;padding:14px;border-radius:11px;border:none;font-size:1rem;font-weight:700;cursor:pointer;}
  .next{background:var(--green);color:#fff;}
  .next:disabled{background:#b9c6c1;cursor:not-allowed;}
  .back{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .warn{background:#fff6f4;border:1px solid #f0c9bd;color:#7c3a28;border-radius:10px;
    padding:9px 11px;font-size:.83rem;margin:10px 0;}
  .note{font-size:.8rem;color:var(--soft);margin-top:6px;}
  .limitbox{font-size:.82rem;color:var(--navy);background:#eef3f7;border-radius:8px;padding:7px 10px;margin-bottom:8px;}
  .limitbox b{color:var(--navy);}
  .final{background:var(--navy);color:#fff;border-radius:14px;padding:18px;margin-top:16px;}
  .final h2{color:#fff;margin-top:0;}
  .final .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:1.05rem;}
  .final .row:last-child{border-bottom:none;}
  .final .row b{font-size:1.2rem;}
  .zsplit{font-size:.85rem;color:#cdd6e2;}
  .ledger{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem;}
  .ledger th,.ledger td{border:1px solid var(--line);padding:5px 6px;text-align:center;}
  .ledger th{background:#f2f5f4;}
  .ledger td.lbl{text-align:left;}
  .reset{background:none;border:none;color:var(--soft);text-decoration:underline;font-size:.8rem;cursor:pointer;margin-top:18px;}
  .hidden{display:none;}
  .wait h2{font-size:1.25rem;color:var(--navy);}
  .wait .done{font-weight:800;color:var(--green);font-size:1.05rem;margin-bottom:8px;}
  .codeform{display:flex;gap:10px;}
  .codeform input{flex:1;min-width:0;padding:12px;font-size:1.3rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;
    border:2px solid var(--line);border-radius:10px;text-align:center;}
  .codeform input:focus{outline:none;border-color:var(--green);}
  .codeform button{padding:12px 16px;border-radius:11px;border:none;font-size:1rem;font-weight:700;cursor:pointer;}
  .tag{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
  .tag.lvt{background:var(--tintg);color:var(--green-d);}
  .tag.reg{background:var(--tintr);color:var(--grey-d);}
  .namefield{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px;}
  .namefield input{display:block;width:100%;margin-top:6px;padding:12px;font-size:1rem;border:2px solid var(--line);border-radius:10px;}
  .share{text-align:center;}
  .qr{width:220px;max-width:100%;margin:6px auto 10px;background:#fff;}
  .qr svg{display:block;width:100%;height:auto;}
  .code{width:100%;height:4.2em;font:11px/1.35 ui-monospace,Consolas,monospace;color:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px;resize:none;word-break:break-all;margin-bottom:8px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- LOCKED GAME NUMBERS ---------- */
/* Keep in sync with tools/rules.py (the Word documents are built from that file). */
const ZONES=[
  // p0 = land price in Year 1, g = rise per year, prem = extra cost to buy a lot back
  // lvtLand / regLand = land tax per lot before the reassessment; lvtLand2 / regLand2 = from the reassessment on
  {key:"DT",name:"Downtown",cost:10,rent:11,lvtLand:11,lvtLand2:13,regLand:1,regLand2:2,maxH:4,parcels:5,p0:40,g:5,prem:20},
  {key:"MT",name:"Midtown", cost:6, rent:7, lvtLand:7, lvtLand2:8, regLand:1,regLand2:1,maxH:3,parcels:6,p0:25,g:3,prem:10},
  {key:"PE",name:"Periphery",cost:3,rent:4, lvtLand:4, lvtLand2:5, regLand:1,regLand2:1,maxH:2,parcels:6,p0:14,g:2,prem:6},
];
const REG_BLDG=[0,1,5,13,25];             // property-tax building tax by height, before the reassessment
const REG_BLDG2=[0,2,7,16,29];            // ... and from the reassessment on (+$1 per story)
const REASSESS_YEAR=4;                    // tax bills are reassessed from this year on
const reassessed=()=>S.round>=REASSESS_YEAR;
const bldgTax=f=>(reassessed()?REG_BLDG2:REG_BLDG)[f];
const START_CASH=110;
const GAME_YEARS=6;                       // facilitator-only: the card ends the game after this year
const limitFor=r=> r<=3?1 : r<=5?2 : 3;   // parcels developed per year
// each year starts only when the team types its code; the facilitator's slide for that year shows it (rules.py YEAR_CODES)
const YEAR_CODES=["","LAND","LOTS","RENT","VALUE","TOWER","BOOM"];
// company value at the start (cash + every lot at Year 1 prices); shareholders' profit is measured from here
const START_WORTH=START_CASH+ZONES.reduce((s,z)=>s+z.parcels*z.p0,0);
const zoneByKey=k=>ZONES.find(z=>z.key===k);
const price=(k,y)=>{const z=zoneByKey(k); return z.p0+z.g*(y-1);};   // same in both towns
const buyPrice=(k,y)=>price(k,y)+zoneByKey(k).prem;

/* ---------- STATE ----------
   We keep it all in memory (no storage). Each parcel tracked as height (0 vacant, -1 sold).
   Per round we record: builds done, sells, buys, and compute rent/tax. */
let S=null;
function fresh(town, name){
  const parcels={};
  ZONES.forEach(z=>parcels[z.key]=Array(z.parcels).fill(0));
  return {
    town, name, round:1, cash:START_CASH, parcels,
    // per-round log for the ledger
    log:[], // {round, built:[], sold:{}, bought:{}, rent, tax, endCash}
    // working counters for the current round
    cur:null,
    locked:true,   // waiting for the facilitator's code to start the current year
    started:false, ended:false
  };
}
function startRoundWork(){
  S.cur={ builtThisRound:0, sells:{DT:0,MT:0,PE:0}, buys:{DT:0,MT:0,PE:0},
          buildActions:[] };
}

/* ---------- HELPERS ---------- */
function parcelsOwned(k){ return S.parcels[k].filter(h=>h>=0).length; }
function totalOwned(){ return ZONES.reduce((s,z)=>s+parcelsOwned(z.key),0); }
function stories(){ let t=0; ZONES.forEach(z=>S.parcels[z.key].forEach(h=>{if(h>0)t+=h;})); return t; }
function storiesByZone(k){ let t=0; S.parcels[k].forEach(h=>{if(h>0)t+=h;}); return t;}
function vacantCount(k){ return S.parcels[k].filter(h=>h===0).length; }
function builtCount(k){ return S.parcels[k].filter(h=>h>0).length; }
function lotLandTax(z){
  if(S.town==="LVT") return reassessed()?z.lvtLand2:z.lvtLand;
  return reassessed()?z.regLand2:z.regLand;
}
function landTax(){ return ZONES.reduce((s,z)=>s+lotLandTax(z)*parcelsOwned(z.key),0); }
function prevWorth(){ return S.log.length?S.log[S.log.length-1].worth:START_WORTH; }
function buildingTax(){
  if(S.town==="LVT") return 0;
  let t=0; ZONES.forEach(z=>S.parcels[z.key].forEach(h=>{if(h>0)t+=bldgTax(h);})); return t;
}
function rentTotal(){
  let t=0; ZONES.forEach(z=>S.parcels[z.key].forEach(h=>{if(h>0)t+=z.rent*h;})); return t;
}
function landValue(y){ return ZONES.reduce((s,z)=>s+price(z.key,y)*parcelsOwned(z.key),0); }
function money(n){ return (n<0?"−$":"$")+Math.abs(n); }

/* ---------- ACTIONS ---------- */
function build(zoneKey, idx, height){
  const z=zoneByKey(zoneKey); const cost=z.cost*height;
  S.parcels[zoneKey][idx]=height; S.cash-=cost; S.cur.builtThisRound++;
  S.cur.buildActions.push({zoneKey,idx,height,cost});
  render();
}
function undoBuild(zoneKey, idx){
  // find the action
  const ai=S.cur.buildActions.findIndex(a=>a.zoneKey===zoneKey&&a.idx===idx);
  if(ai<0) return;
  const a=S.cur.buildActions[ai];
  S.parcels[zoneKey][idx]=0; S.cash+=a.cost; S.cur.builtThisRound--;
  S.cur.buildActions.splice(ai,1); render();
}
function sellOne(zoneKey){
  // sell one vacant parcel in this zone
  const arr=S.parcels[zoneKey]; const idx=arr.findIndex(h=>h===0);
  if(idx<0) return;
  arr[idx]=-1; S.cash+=price(zoneKey,S.round); S.cur.sells[zoneKey]++; render();
}
function unsellOne(zoneKey){
  if(S.cur.sells[zoneKey]<=0) return;
  const arr=S.parcels[zoneKey]; const idx=arr.findIndex(h=>h===-1);
  if(idx<0) return;
  arr[idx]=0; S.cash-=price(zoneKey,S.round); S.cur.sells[zoneKey]--; render();
}
function buyOne(zoneKey){
  // buy back a sold parcel
  const arr=S.parcels[zoneKey]; const idx=arr.findIndex(h=>h===-1);
  if(idx<0) return;
  if(S.cash<buyPrice(zoneKey,S.round)) return;
  arr[idx]=0; S.cash-=buyPrice(zoneKey,S.round); S.cur.buys[zoneKey]++; render();
}
function unbuyOne(zoneKey){
  if(S.cur.buys[zoneKey]<=0) return;
  const arr=S.parcels[zoneKey]; const idx=arr.findIndex(h=>h===0);
  if(idx<0) return;
  arr[idx]=-1; S.cash+=buyPrice(zoneKey,S.round); S.cur.buys[zoneKey]--; render();
}

function finishRound(){
  const r=S.round;
  let rent=0, tax=0;
  if(r>=2){
    rent=rentTotal(); tax=landTax()+buildingTax();
    if(S.cash+rent-tax<0) return;            // no loans: sell vacant land first
    S.cash += rent - tax;
  }
  const land=landValue(r);
  S.log.push({round:r, built:[...S.cur.buildActions], sells:{...S.cur.sells}, buys:{...S.cur.buys},
              rent, tax, endCash:S.cash, land, worth:S.cash+land, stories:stories(), owned:totalOwned()});
  window.scrollTo(0,0);
  if(r>=GAME_YEARS){ S.ended=true; S.autoEnded=true; render(); return; }   // the final year ends the game
  S.round++; S.locked=true; startRoundWork(); render();
}
function unlock(){
  const el=document.getElementById("yearCode");
  const typed=(el.value||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
  if(typed===YEAR_CODES[S.round]){ S.locked=false; window.scrollTo(0,0); render(); return; }
  document.getElementById("codeMsg").classList.remove("hidden"); el.select();
}
function endGame(){
  // facilitator-triggered early finish. Close out the current in-progress year WITHOUT collecting another
  // year's rent/tax (the last completed year is already logged). Just show results.
  S.ended=true; render();
}

/* ---------- RENDER ---------- */
function render(){
  const app=document.getElementById("app");
  if(!S){ app.innerHTML=townPick(); return; }
  if(S.ended){ app.innerHTML=finalScreen(); wire(); return; }
  if(S.locked){ app.innerHTML = header() + statusBar() + waitCard() + endEarlyBtn() + resetBtn();
    const el=document.getElementById("yearCode"); if(el) el.focus({preventScroll:true}); return; }
  app.innerHTML = header() + statusBar() + roundCard() + navButtons() + resetBtn();
  wire();
}

function townPick(){
  return `
  <h1><span class="lock">LAND LOCKED?</span> Score Card</h1>
  <div class="sub">Name your town, then pick its tax rules to begin. Every team has the same board, the same $110 to start, and the same land prices — only the tax rules differ.</div>
  <label class="namefield">Your town’s name
    <input id="townName" maxlength="24" placeholder="e.g. Riverton" autocomplete="off"></label>
  <div class="town-pick">
    <button class="lvt" onclick="choose('LVT')">Land Tax Town
      <small>Tax on land only — same bill no matter what you build</small></button>
    <button class="reg" onclick="choose('REG')">Property Tax Town
      <small>Tax on land + buildings — taller costs more</small></button>
  </div>
  <div class="note">After you pick, your card waits for your host: each year starts with a code shown on the screen.</div>
  <div class="note">Nothing is saved to a server — your game lives on this device. Don't refresh the page mid-game.</div>`;
}
function header(){
  const tag = S.town==="LVT"?`<span class="tag lvt">Land Tax</span>`:`<span class="tag reg">Property Tax</span>`;
  return `<h1 style="font-size:1.25rem"><span class="lock">LAND LOCKED?</span> ${esc(S.name)}${tag}</h1>`;
}
function statusBar(){
  const neg=S.cash<0?"neg":"";
  return `<div class="bar">
    <div><div class="lbl">Bank</div><div class="cash ${neg}">${money(S.cash)}</div></div>
    <div><div class="lbl">Land value</div><div class="cash" style="font-size:1rem">${money(landValue(S.round))}</div></div>
    <div><div class="lbl">Company value</div><div class="cash" style="font-size:1rem;color:var(--navy)">${money(S.cash+landValue(S.round))}</div></div>
    <div class="pill">Parcels owned: <b>${totalOwned()}</b></div>
    <div class="pill">Stories: <b>${stories()}</b></div>
    <div class="rnd">Year ${S.round}</div>
  </div>`;
}

function roundCard(){
  const limit=limitFor(S.round);
  const setup = S.round===1;
  let html="";

  // Round 1 setup note / normal note
  html += `<div class="limitbox">`;
  if(setup){ html += `<b>Year 1 — setup.</b> Build on up to <b>${limit} lot</b>. No rent and no taxes yet — they start next year.`; }
  else { html += `Build limit this year: <b>${limit} lot${limit>1?"s":""}</b>. `+
                 `Steps: sell/buy → build → collect rent → pay tax.`; }
  html += `<br>Land prices this year: ` + ZONES.map(z=>`${z.name} <b>$${price(z.key,S.round)}</b>`).join(" · ") +
          ` <span class="muted">(they rise every year)</span>`;
  html += `</div>`;
  if(S.round===REASSESS_YEAR){
    html += `<div class="warn" style="background:#fff8e6;border-color:#f0d9a0;color:#6b4e00"><b>Reassessment year.</b> The town has re-valued property, and your tax bill changes from this year on: `+
      (S.town==="LVT"
        ? `land is worth more, so <b>land tax rises</b> to $${ZONES.map(z=>z.lvtLand2).join(" / $")} a lot (Downtown / Midtown / Periphery). Your buildings are still not taxed.`
        : `everything you’ve built is reassessed, so <b>building tax rises $1 per story</b> (1–4 stories: $${REG_BLDG2.slice(1).join(" / $")}), and Downtown land tax rises to $${ZONES[0].regLand2}.`)+`</div>`;
  }
  if(S.round>1 && limitFor(S.round)>limitFor(S.round-1)){
    html += `<div class="warn" style="background:#eaf3ed;border-color:#b9dcc8;color:#0a5442"><b>Your company is growing!</b> More construction crews — you can now develop <b>${limitFor(S.round)} lots</b> this year.</div>`;
  }

  // STEP 1 buy/sell — only from Round 2 on. Round 1 is build-only (setup).
  if(!setup){
  html += `<div class="card"><h2>1 · Buy or Sell Land</h2>
    <div class="step">Only vacant lots can be sold, at this year’s land price. Selling gives cash now and lowers your land tax, but you give up the land’s rising value; buying back costs more than the price.</div>`;
  ZONES.forEach(z=>{
    const vac=vacantCount(z.key), sold=S.parcels[z.key].filter(h=>h===-1).length;
    html += `<div class="rowline">
      <div class="desc">${z.name} <small>· sell +$${price(z.key,S.round)} / buy −$${buyPrice(z.key,S.round)} · vacant ${vac}, sold ${sold}</small></div>
      <div style="display:flex;gap:6px;">
        <div class="stepper"><button onclick="unsellOne('${z.key}')">−</button>
          <div class="val" title="sold this year">${S.cur.sells[z.key]}</div>
          <button onclick="sellOne('${z.key}')">+</button></div>
      </div></div>`;
  });
  html += `<div class="note">Sold this year shown above. Need land back? Buy:</div>`;
  ZONES.forEach(z=>{
    const soldAvail=S.parcels[z.key].filter(h=>h===-1).length;
    if(soldAvail>0 || S.cur.buys[z.key]>0){
      html += `<div class="rowline"><div class="desc">Buy back ${z.name} <small>−$${buyPrice(z.key,S.round)}</small></div>
      <div class="stepper"><button onclick="unbuyOne('${z.key}')">−</button>
        <div class="val">${S.cur.buys[z.key]}</div>
        <button onclick="buyOne('${z.key}')">+</button></div></div>`;
    }
  });
  html += `</div>`;
  } // end buy/sell (rounds 2+)

  // BUILD — step 1 in the setup round, step 2 otherwise
  const buildNo = setup ? "1" : "2";
  html += `<div class="card"><h2>${buildNo} · Build</h2>
    <div class="step">Develop up to ${limit} lot${limit>1?"s":""} this year, within your cash. Tap a height to build; tap again to undo.</div>`;
  const canBuildMore = S.cur.builtThisRound < limit;
  ZONES.forEach(z=>{
    html += `<div class="zone"><div class="zt">${z.name} — build $${z.cost}/story, rent $${z.rent}/story`;
    html += S.town==="LVT" ? `, land tax $${lotLandTax(z)}` : ``;
    html += `</div>`;
    // list parcels of this zone
    S.parcels[z.key].forEach((h,idx)=>{
      if(h===-1) return; // sold, skip
      if(h>0){
        // built — show height, allow undo only if built THIS round
        const thisRound=S.cur.buildActions.some(a=>a.zoneKey===z.key&&a.idx===idx);
        html += `<div class="rowline built"><div class="desc">Lot ${idx+1}: <b>${h}-story</b> ${thisRound?'':'<small>(earlier round)</small>'}</div>`;
        html += thisRound? `<button class="back" style="padding:6px 10px;border-radius:8px;font-size:.8rem" onclick="undoBuild('${z.key}',${idx})">undo</button>`:`<span class="muted" style="font-size:.8rem">locked</span>`;
        html += `</div>`;
      } else {
        // vacant, offer to build heights 1..maxH
        html += `<div class="rowline"><div class="desc">Lot ${idx+1}: <small>vacant</small></div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;">`;
        for(let hh=1;hh<=z.maxH;hh++){
          const cost=z.cost*hh; const afford=S.cash>=cost && canBuildMore;
          html += `<button class="back" ${afford?'':'disabled'} style="padding:6px 9px;border-radius:8px;font-size:.8rem;${afford?'':'opacity:.4'}" onclick="build('${z.key}',${idx},${hh})">${hh}f · $${cost}</button>`;
        }
        html += `</div></div>`;
      }
    });
    html += `</div>`;
  });
  if(!canBuildMore){ html += `<div class="note">Build limit reached for this year.</div>`; }
  html += `</div>`;

  // STEP 3 & 4 preview (rounds 2+)
  if(S.round>=2){
    const rent=rentTotal(), lt=landTax(), bt=buildingTax(), tax=lt+bt;
    const net=rent-tax;
    html += `<div class="card"><h2>3 · Rent &nbsp;·&nbsp; 4 · Tax</h2>
      <div class="step">Calculated automatically from what you own right now.</div>
      <div class="summary">
        <div>Rent collected</div><div class="v plus">+${money(rent)}</div>
        <div>Land tax</div><div class="v minus">−${money(lt)}</div>`;
    if(S.town==="REG"){ html += `<div>Building tax</div><div class="v minus">−${money(bt)}</div>`; }
    html += `<div class="divider" style="grid-column:1/3"></div>
        <div><b>Net this year</b></div><div class="v ${net>=0?'plus':'minus'}"><b>${net>=0?'+':''}${money(net)}</b></div>
        <div>Bank after this year</div><div class="v">${money(S.cash+net)}</div>
        <div>Company value after this year</div><div class="v">${money(S.cash+net+landValue(S.round))}</div>
      </div></div>`;
  } else {
    html += `<div class="card"><h2>Rent &amp; Tax</h2>
      <div class="step">Year 1 is setup — no rent and no taxes yet. They begin in Year 2.</div></div>`;
  }
  return html;
}

function waitCard(){
  const last=S.log[S.log.length-1];
  let html=`<div class="card wait">`;
  if(last){
    html += `<div class="done">✓ Year ${last.round} is done.</div>`;
    if(last.round>=2) html += `<div class="summary" style="margin-bottom:12px">
        <div>Rent collected</div><div class="v plus">+${money(last.rent)}</div>
        <div>Taxes paid</div><div class="v minus">−${money(last.tax)}</div>
        <div><b>Company value</b></div><div class="v"><b>${money(last.worth)}</b></div></div>`;
    html += `<div class="note" style="margin:0 0 12px">Make sure your board matches what you did this year.</div>`;
  }
  html += `<h2>Waiting for Year ${S.round}</h2>
    <div class="step">Your host starts each year. When Year ${S.round} is on the screen, type its code here.</div>
    <div class="codeform"><input id="yearCode" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"
        placeholder="Code" onkeydown="if(event.key==='Enter')unlock()">
      <button class="next" onclick="unlock()">Start Year ${S.round}</button></div>
    <div id="codeMsg" class="warn hidden">That’s not the code for Year ${S.round}. Check the screen — or wait for your host to put it up.</div>
  </div>`;
  return html;
}
function navButtons(){
  const label = S.round===1 ? "Finish setup → begin Year 2"
             : `End Year ${S.round} → Year ${S.round+1}`;
  // warn if cash would go negative after this round
  let warn="", short=false;
  if(S.round>=2){
    const net=rentTotal()-(landTax()+buildingTax());
    if(S.cash+net<0){ short=true; warn=`<div class="warn">⚠ After paying tax you'll be short by ${money(Math.abs(S.cash+net))}. No loans — sell some vacant land (Step 1) before ending the year.</div>`; }
  }
  return warn+`<div class="btns"><button class="next" ${short?'disabled':''} onclick="finishRound()">${label}</button></div>`
    +endEarlyBtn();
}
function endEarlyBtn(){ return `<button class="reset" onclick="if(confirm('End the game now and see results? Do this only if the facilitator tells you to stop early.')){endGame();}">End game early (only if the facilitator says)</button><br>`; }
function resetBtn(){ return `<button class="reset" onclick="if(confirm('Start over? This clears your game.')){S=null;render();}">Start over</button>`; }

function finalScreen(){
  const dt=storiesByZone("DT"), mt=storiesByZone("MT"), pe=storiesByZone("PE");
  // land is valued at the price of the last completed year
  const lastYear=Math.max(1,S.log.length?S.log[S.log.length-1].round:1);
  const land=landValue(lastYear);
  let rows=S.log.map((l,i)=>`<tr><td class="lbl">Year ${l.round}</td>
     <td>${l.round>=2?'+$'+l.rent:'—'}</td>
     <td>${l.round>=2?'−$'+l.tax:'—'}</td>
     <td>${l.stories}</td>
     <td>$${l.endCash}</td>
     <td>$${l.land}</td>
     <td><b>$${l.worth}</b></td></tr>`).join("");
  const tag = S.town==="LVT"?`<span class="tag lvt">Land Tax Town</span>`:`<span class="tag reg">Property Tax Town</span>`;
  const code=resultCode(lastYear, land);
  const banner = S.autoEnded
    ? `<div class="limitbox"><b>That was the final year.</b> The game is over — show your code below to the facilitator.</div>` : ``;
  return `<h1 style="font-size:1.25rem"><span class="lock">LAND LOCKED?</span> ${esc(S.name)} ${tag}</h1>
  ${banner}
  <div class="final">
    <h2>Final tally</h2>
    <div class="row"><span>Company value</span><b>$${S.cash+land}</b></div>
    <div class="row"><span>Dollars in the bank</span><b>$${S.cash}</b></div>
    <div class="row"><span>Land value <span class="zsplit">(Year ${lastYear} prices)</span></span><b>$${land}</b></div>
    <div class="row"><span>Parcels owned</span><b>${totalOwned()} / 17</b></div>
    <div class="row"><span>Total stories built</span><b>${stories()}</b></div>
    <div class="row"><span class="zsplit">Downtown ${dt} · Midtown ${mt} · Periphery ${pe}</span><span></span></div>
  </div>
  <div class="card"><h2>Year by year</h2>
    <table class="ledger"><thead><tr><th>Year</th><th>Rent</th><th>Tax</th><th>Stories</th><th>Bank</th><th>Land</th><th>Company</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="note">Bring these numbers to the debrief — especially how many parcels you ended up owning, and where you built.</div>
  </div>
  <div class="card share"><h2>Send your results to the scoreboard</h2>
    <div class="step">Hold this up to the facilitator’s camera, or send them the code.</div>
    <div class="qr" id="qr">${qrSvg(code)}</div>
    <textarea class="code" readonly onclick="this.select()">${code}</textarea>
    <button class="back" style="padding:8px 12px;border-radius:9px" onclick="copyCode(this)">Copy code</button>
  </div>
  <button class="reset" onclick="if(confirm('Play again? This clears your game.')){S=null;render();}">Play again</button>`;
}

/* ---------- RESULTS CODE (read by Land_Locked_Debrief_Scoreboard.html) ---------- */
function resultCode(lastYear, land){
  const d={v:1, n:S.name, t:S.town, y:lastYear, c:S.cash, l:land,
           p:ZONES.map(z=>S.parcels[z.key]), w:S.log.map(l=>l.worth)};
  const bytes=new TextEncoder().encode(JSON.stringify(d));
  let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return "LL1."+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function qrSvg(text){
  if(typeof qrcode!=="function") return `<div class="note">QR code unavailable offline — send the code instead.</div>`;
  const q=qrcode(0,"M"); q.addData(text); q.make();
  return q.createSvgTag({cellSize:4, margin:4, scalable:true});
}
function copyCode(btn){
  const t=document.querySelector(".code"); t.select();
  try{ navigator.clipboard.writeText(t.value).then(()=>btn.textContent="Copied!", ()=>document.execCommand("copy")); }
  catch(e){ document.execCommand("copy"); btn.textContent="Copied!"; }
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- INIT ---------- */
function choose(t){
  const name=(document.getElementById("townName").value||"").trim().slice(0,24) || "Unnamed town";
  S=fresh(t, name); startRoundWork(); render();
}
function wire(){ /* inline onclick handlers used; nothing to wire */ }
render();
</script>

</html>
